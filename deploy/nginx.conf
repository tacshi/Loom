server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  location = /sw.js { expires -1; }
  location = /index.html { expires -1; }
  location /assets/ { expires 1y; }
  location / { try_files $uri $uri/ /index.html; }
}
