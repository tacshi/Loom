name: Verify Loom
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node dist-cli/loom.mjs validate tests/fixtures/v2/calculator.loom.json
      - run: node dist-cli/loom.mjs test tests/fixtures/v2/calculator.loom.json --report test-results/cli
      - run: node dist-cli/loom.mjs course-check tests/fixtures/v3/course-completed.loom.json --json > test-results/course.json
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run preview > /tmp/loom-preview.log 2>&1 &
      - run: npm run test:browser
        env:
          LOOM_BASE_URL: http://127.0.0.1:4173
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: test-results
